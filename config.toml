# ==============================================================================
# КОНФИГУРАЦИОННЫЙ ФАЙЛ OSD-CLOCK (TOML)
# ==============================================================================
# Этот файл позволяет настраивать внешний вид, позиционирование и формат
# отображения часов. Настройки из этого файла имеют приоритет над дефолтными,
# но переопределяются флагами командной строки (CLI).
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. НАСТРОЙКИ ШРИФТА
# ------------------------------------------------------------------------------

# Имя шрифта, установленного в системе Windows.
# Пример: "Consolas", "Segoe UI", "Arial", "Ubuntu", "Courier New"
font_name = "Ubuntu"

# Размер шрифта в пикселях/поинтах.
# Допустимые значения: от 10 до 200 (рекомендуется 32-72)
font_size = 50

# Жирность шрифта (Font Weight).
# Стандартные значения Win32 API:
#   100 — Thin
#   300 — Light
#   400 — Normal / Regular (по умолчанию)
#   600 — Semi-Bold
#   700 — Bold
#   900 — Heavy / Black
font_weight = 600

# ------------------------------------------------------------------------------
# 2. ВНЕШНИЙ ВИД И ЦВЕТ
# ------------------------------------------------------------------------------

# Цвет текста часов.
# Доступные палитры: "green", "red", "blue", "white", "yellow", "cyan", "magenta", "gray"
color = "yellow"

# ------------------------------------------------------------------------------
# 3. ПОЗИЦИОНИРОВАНИЕ НА ЭКРАНЕ
# ------------------------------------------------------------------------------

# Координата X (в пикселях от левого края главного экрана).
# Значение -1 активирует автоматическое позиционирование в правый верхний/нижний угол.
pos_x = 1760

# Координата Y (в пикселях от верхнего края главного экрана).
# Значение -1 активирует автоматическое позиционирование.
pos_y = 30

# ------------------------------------------------------------------------------
# 4. ФОРМАТ ВРЕМЕНИ
# ------------------------------------------------------------------------------

# Формат отображения времени:
#   "24h" — 24-часовой формат (например, 14:30)
#   "12h" — 12-часовой формат без AM/PM (например, 02:30)
time_format = "12h"